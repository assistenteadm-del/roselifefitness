<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Friday | Rose Life Fitness</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6ff;--card:#fff;--text:#2e1a47;--muted:#7d6b94;--brand:#d6338f;--lil:#8e5bd6;--lil-d:#6b3fb0;--lil-l:#e9dcfa;--pink-l:#ffd9ec;--line:#e6d9f5;--chip:#f1e8fc;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170f24;--card:#241838;--text:#f3eaff;--muted:#b9a6d6;--brand:#ff6bb5;--lil:#b794f6;--lil-d:#8e5bd6;--lil-l:#3d2a5c;--pink-l:#4f2347;--line:#3d2a5c;--chip:#33224f}}
:root[data-theme="dark"]{--bg:#170f24;--card:#241838;--text:#f3eaff;--muted:#b9a6d6;--brand:#ff6bb5;--lil:#b794f6;--lil-d:#8e5bd6;--lil-l:#3d2a5c;--pink-l:#4f2347;--line:#3d2a5c;--chip:#33224f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{text-align:center;padding:28px 16px 26px;color:#fff;background:linear-gradient(135deg,#6b3fb0 0%,#a35bd0 50%,#e0509a 100%);border-radius:0 0 26px 26px}
.tag{background:#fff;color:#6b3fb0;font-weight:700;font-size:12px;letter-spacing:.12em;padding:5px 12px;border-radius:99px}
h1{margin:14px 0 8px;line-height:0}.logo{width:min(140px,42%);height:auto}header p{margin:0 auto;max-width:480px;color:#f6e9ff;font-size:14px}
.tools{max-width:980px;margin:12px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.tools input,.tools select{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;width:100%}
.row{display:flex;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--lil-d);border-color:var(--lil-d);color:#fff}
.count{max-width:980px;margin:8px auto 0;padding:0 14px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;max-width:980px;margin:10px auto;padding:0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.sel{border-color:var(--brand)}
.ph{height:90px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,var(--lil-l),var(--pink-l));position:relative}
.off{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px}
.info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:14px;line-height:1.25}.sub{color:var(--lil-d);font-size:12px}
.old{color:var(--muted);text-decoration:line-through;font-size:12px}.new{color:var(--brand);font-weight:800;font-size:19px}
.sizes{display:flex;gap:5px;flex-wrap:wrap}
.sz{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.sz.on{background:var(--lil-d);border-color:var(--lil-d);color:#fff}
.add{margin-top:auto;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;background:var(--brand);color:#fff}
.add.in{background:var(--ok)}.hint{font-size:12px;color:var(--brand);min-height:14px}
.more{display:block;margin:10px auto 0;padding:12px 24px;border-radius:10px;border:1px solid var(--lil);background:none;color:var(--lil-d);font-weight:700;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.btn{border-radius:10px;padding:12px 16px;font-weight:800;font-size:15px;border:0;cursor:pointer;text-decoration:none;text-align:center}
.bag{background:var(--chip);color:var(--text)}.send{background:#25d366;color:#073b1c;flex:1;max-width:320px}.dis{opacity:.45;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.it button{background:none;border:0;color:var(--brand);font-size:20px;cursor:pointer}
.sheet input{width:100%;padding:11px;margin:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
/* Alternador de tema */
header{position:relative}
.theme-toggle{position:absolute;right:16px;top:16px;width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;transition:background .2s,transform .2s;z-index:2}
.theme-toggle:hover{background:rgba(255,255,255,.3);transform:scale(1.05)}
.theme-toggle:focus-visible{outline:3px solid #fff;outline-offset:3px}
.theme-toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Redes sociais no rodape: PNGs trocam com o tema */
.social-footer{max-width:980px;margin:38px auto 0;padding:26px 16px 32px;text-align:center;border-top:1px solid var(--line)}
.social-title{font-weight:750;font-size:15px;margin:0 0 18px;color:var(--text)}
.social-links{display:flex;justify-content:center;align-items:center;gap:clamp(18px,6vw,42px);flex-wrap:wrap}
.social-link{display:flex;align-items:center;flex-direction:column;gap:7px;text-decoration:none;color:var(--text);font-size:12px;font-weight:600;transition:transform .18s,opacity .18s}
.social-link:hover{transform:translateY(-3px);opacity:.8}
.social-link:focus-visible{outline:3px solid var(--brand);outline-offset:6px;border-radius:6px}
.social-icon{display:block;width:32px;height:32px;object-fit:contain}
.social-icon.dark{display:none}
:root[data-theme="dark"] .social-icon.light{display:none}
:root[data-theme="dark"] .social-icon.dark{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .social-icon.light{display:none}:root:not([data-theme="light"]) .social-icon.dark{display:block}}
</style></head><body>

  });
})();

const CATS=["Todas",...Object.keys(EMO)].filter(c=>c=="Todas"||D.some(p=>p.cat==c));

function lista(){return D.filter(p=>(st.cat=="Todas"||p.cat==st.cat)&&(!st.q||norm(p.n+" "+p.c+" "+p.m).includes(norm(st.q)))&&(!st.tam||p.s.some(x=>x[0]==st.tam))&&(!st.desc||p.d==st.desc));}
function render(){
  const L=lista(),V=L.slice(0,st.lim);
  $("count").textContent=L.length+" peças encontradas";
  $("more").style.display=L.length>st.lim?"block":"none";
  $("grid").innerHTML=V.map(p=>{const por=p.p*(1-p.d/100),on=sel[p.i];
  return `<div class="card${on?" sel":""}"><div class="ph">${EMO[p.cat]}<span class="off">-${p.d}%</span></div><div class="info">

  <div><span class="old">${brl(p.p)}</span><br><span class="new">${brl(por)}</span></div>
  <div class="sizes">${p.s.map(x=>`<button class="sz${esc[p.i]==x[0]?" on":""}" data-p="${p.i}" data-t="${x[0]}">${x[0]}</button>`).join("")}</div>
  <div class="hint" id="h${p.i}"></div>
  <button class="add${on?" in":""}" data-add="${p.i}">${on?"✓ Na sacola":"Adicionar"}</button></div></div>`}).join("");
  bar();
}
function itens(){return Object.keys(sel).map(i=>{const p=D.find(x=>x.i==i);return {p,t:sel[i],v:p.p*(1-p.d/100)}});}
function link(){const it=itens(),nome=$("nome").value.trim();
  const l=it.map(x=>`• ${x.p.n}${x.p.c?" "+x.p.c:""} (tam. ${x.t}) – ${brl(x.v)}`).join("\n");
  const tot=it.reduce((a,x)=>a+x.v,0);
  return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(`Olá, Rose Life Fitness! ${nome?"Sou "+nome+". ":""}Quero estas peças da Black Friday:\n\n${l}\n\nTotal: ${brl(tot)}\n\nPodemos continuar o atendimento?`);}
function bar(){const n=Object.keys(sel).length;$("bagb").textContent=`🛍️ Sacola (${n})`;
  const a=$("send");a.classList.toggle("dis",!n);a.textContent=n?"Enviar no WhatsApp":"Escolha suas peças";if(n)a.href=link();}
function sacola(){const it=itens();
  $("items").innerHTML=it.length?it.map(x=>`<div class="it"><span>${x.p.n} ${x.p.c} · tam. ${x.t}<br><b>${brl(x.v)}</b></span><button data-rm="${x.p.i}">✕</button></div>`).join(""):"<p>Sua sacola está vazia.</p>";
  $("tot").textContent=it.length?"Total: "+brl(it.reduce((a,x)=>a+x.v,0)):"";
  $("send2").style.display=it.length?"block":"none";if(it.length)$("send2").href=link();}
$("grid").addEventListener("click",e=>{const t=e.target,i=t.dataset.p||t.dataset.add;
  if(t.dataset.t){esc[i]=t.dataset.t;if(sel[i])sel[i]=t.dataset.t;render();}
  if(t.dataset.add){if(sel[i])delete sel[i];else if(!esc[i]){$("h"+i).textContent="Escolha um tamanho";return;}else sel[i]=esc[i];render();}});
